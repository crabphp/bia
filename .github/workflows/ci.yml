name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pcntl, posix, pdo_sqlite
          coverage: none
      - name: Install ripgrep, which the search tool runs
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
